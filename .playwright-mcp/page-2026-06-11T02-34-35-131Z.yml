          - generic [ref=e207]:
            - generic [ref=e209]:
              - paragraph [ref=e210]:
                - text: "**富兰克林效应（Franklin Effect）**是一种心理学现象，指的是当一个人让另一人为自己做了一件好事（或付出帮助）后，前者往往会对后者产生更积极的评价和更大的亲近感。换句话说，“"
                - strong [ref=e211]: 让别人为你做事会让你更喜欢他
                - text: ”。
              - heading "产生机制" [level=3] [ref=e212]
              - list [ref=e213]:
                - listitem [ref=e214]:
                  - paragraph [ref=e215]:
                    - strong [ref=e216]: 认知失调理论
                  - list [ref=e217]:
                    - listitem [ref=e218]:
                      - text: 当我们对自己的行为（帮助别人的人）进行自我解释时，如果没有明显的外在动机（如金钱、职责），大脑会倾向于把动机归因于“我对他有好感”。于是，
                      - strong [ref=e219]: 为了消除行为与自我形象之间的矛盾
                      - text: ，我们会调节对对方的态度，使之更正面。
                - listitem [ref=e220]:
                  - paragraph [ref=e221]:
                    - strong [ref=e222]: 自我感知
                  - list [ref=e223]:
                    - listitem [ref=e224]: 人们会观察自己的行为来推断自己的态度。如果我主动帮助了某人，我会假设自己一定是喜欢或认可他，否则为何会付出？
                - listitem [ref=e225]:
                  - paragraph [ref=e226]:
                    - strong [ref=e227]: 投入与承诺
                  - list [ref=e228]:
                    - listitem [ref=e229]: 对某人投入时间或资源后，会产生“投入的合理化”，更倾向于维护这段关系，以免自己的付出显得无意义。
              - heading "经典案例" [level=3] [ref=e230]
              - list [ref=e231]:
                - listitem [ref=e232]:
                  - strong [ref=e233]: 本杰明·富兰克林
                  - text: （Benjamin Franklin）本人曾在《穷理查年鉴》中记述：他想让一位竞争对手帮忙寄一封信。对方答应后，富兰克林对这位竞争对手的好感大增，最终两人结成了朋友。
                - listitem [ref=e234]:
                  - strong [ref=e235]: 实验研究
                  - text: ：在1965年，心理学家M. B. Aronson 让学生们向另一位学生（实际上是实验者的代理）写一封恭维信。结果，那些写信的学生对该学生的好感显著提升，甚至比未写信的学生更喜欢他。
