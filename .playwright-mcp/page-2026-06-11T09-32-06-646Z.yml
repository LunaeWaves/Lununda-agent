                - text: FastClaw 是一款用
                - strong [ref=e185]: Go 语言
                - text: 编写的
                - strong [ref=e186]: 多用户 AI Agent 运行时
                - text: 。它提供了一个统一的底座，帮助开发者在多租户环境下
                - strong [ref=e187]: 创建、管理、运行
                - text: 各种 AI Agent。每个 Agent 都拥有独立的：
              - list [ref=e188]:
                - listitem [ref=e189]:
                  - strong [ref=e190]: SOUL.md
