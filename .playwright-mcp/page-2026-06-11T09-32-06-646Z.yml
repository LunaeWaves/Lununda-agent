                - listitem [ref=e191]:
                  - strong [ref=e192]: 记忆（Memory）
                  - text: – 持久化的知识和对话上下文
                - listitem [ref=e193]:
                  - strong [ref=e194]: 技能（Skills）
                  - text: – 可调用的工具集，如网页抓取、代码执行等
                - listitem [ref=e195]:
                  - strong [ref=e196]: 工具（Tools）
                  - text: – 与外部系统交互的接口
              - paragraph [ref=e197]:
                - text: FastClaw 只需部署一个
                - strong [ref=e198]: 单体二进制文件
                - text: ，即同时提供：
              - list [ref=e199]:
                - listitem [ref=e200]:
                  - strong [ref=e201]: HTTP API 网关
                  - text: – 供其他系统通过 REST 调用 Agent
                - listitem [ref=e202]:
                  - strong [ref=e203]: Web UI
                  - text: – 直观管理和调试 Agent 的界面
              - paragraph [ref=e204]:
                - text: 因此，它特别适合需要
                - strong [ref=e205]: 大规模管理多个 AI 助手
                - text: 的企业或平台，既能保证每个 Agent 的独立性，又能统一监控、配置和扩展。简而言之，FastClaw 就是让多用户 AI Agent 的整个生命周期（创建 → 配置 → 运行 → 维护）变得方便、可控的一站式平台。
