              - paragraph [ref=e140]:
                - text: FastClaw 是一款
                - strong [ref=e141]: 自托管的 AI 代理平台
                - text: ，它让你可以在自己的机器或私有服务器上运行、管理和定制 AI 助手。主要特点包括：
              - list [ref=e142]:
                - listitem [ref=e143]:
                  - strong [ref=e144]: 本地部署
                  - text: ：所有模型和数据都保存在本地，避免了对第三方云服务的依赖，提升了隐私和安全性。
                - listitem [ref=e145]:
                  - strong [ref=e146]: 插件化扩展
                  - text: ：通过内置的工具链（如
                  - code [ref=e147]: "`camoufox-cli`"
                  - text: 、
                  - code [ref=e148]: "`find‑skills`"
                  - text: 、
                  - code [ref=e149]: "`skill‑creator`"
                  - text: 等），可以让代理轻松调用浏览器、文件系统、网络请求等功能，甚至自行创建新技能。
                - listitem [ref=e150]:
                  - strong [ref=e151]: 多语言支持
                  - text: ：界面和交互都可以使用中文、英文等多种语言，方便不同地区的用户使用。
                - listitem [ref=e152]:
                  - strong [ref=e153]: 可编排的工作流
                  - text: ：支持计划任务、定时提醒、子代理并行（
                  - code [ref=e154]: "`delegate_task`"
                  - text: ）等高级调度，适合复杂的业务流程。
                - listitem [ref=e155]:
                  - strong [ref=e156]: 灵活的身份与记忆管理
                  - text: ：通过
                  - code [ref=e157]: "`IDENTITY.md`"
                  - text: 、
                  - code [ref=e158]: "`SOUL.md`"
                  - text: 、
                  - code [ref=e159]: "`MEMORY.md`"
                  - text: 等文件，让每个代理拥有独立的角色设定和长期记忆。
              - paragraph [ref=e160]:
                - text: 简而言之，FastClaw 为开发者和企业提供了一套
                - strong [ref=e161]: 可自行控制、可高度定制
                - text: 的 AI 助手解决方案，既能满足日常问答、信息检索等轻量需求，也能通过插件和脚本实现高级自动化任务。希望这个介绍能帮你快速了解 FastClaw！如果还有其他想了解的细节，随时告诉我。
