              - paragraph [ref=e142]:
                - text: FastClaw 是一款基于
                - strong [ref=e143]: Go 语言
                - text: 开发的
                - strong [ref=e144]: 多用户 AI Agent 运行时
                - text: 。它的核心作用是为需要创建、管理和运行 AI Agent 的系统提供统一的底层平台，尤其适用于多租户环境下的 Agent 全生命周期管理。
              - paragraph [ref=e145]: 主要特性包括：
              - list [ref=e146]:
                - listitem [ref=e147]:
                  - paragraph [ref=e148]:
                    - strong [ref=e149]: 多租户支持
                    - text: 同一套 FastClaw 实例可以同时容纳多个独立的 Agent，每个 Agent 拥有各自的配置与资源，互不干扰。
                - listitem [ref=e150]:
                  - paragraph [ref=e151]:
                    - strong [ref=e152]: 完整的 Agent 结构
                    - text: 每个 Agent 都配备：
                  - list [ref=e153]:
                    - listitem [ref=e154]:
                      - strong [ref=e155]: SOUL.md
                      - text: ：定义 Agent 的身份、角色和行为准则。
                    - listitem [ref=e156]:
                      - strong [ref=e157]: 记忆（Memory）
                      - text: ：持久化的对话和知识存储。
                    - listitem [ref=e158]:
                      - strong [ref=e159]: 技能（Skills）
                      - text: ：可复用的功能模块，如网页抓取、文本处理等。
                    - listitem [ref=e160]:
                      - strong [ref=e161]: 工具（Tools）
                      - text: ：底层系统调用、文件操作、网络请求等。
                - listitem [ref=e162]:
                  - paragraph [ref=e163]:
                    - strong [ref=e164]: 统一的 API 与 UI
                  - list [ref=e165]:
                    - listitem [ref=e166]:
                      - strong [ref=e167]: HTTP API
                      - text: ：单一二进制文件即提供完整的网关接口，方便外部系统调用。
                    - listitem [ref=e168]:
                      - strong [ref=e169]: Web 界面
                      - text: ：内置的管理控制台，让管理员可以直观地创建、配置、监控各个 Agent。
                - listitem [ref=e170]:
                  - paragraph [ref=e171]:
                    - strong [ref=e172]: 插件化与可扩展
                    - text: 通过自定义 Skill 和 Tool，开发者可以为 Agent 增添各种业务能力，而无需改动核心代码。
                - listitem [ref=e173]:
                  - paragraph [ref=e174]:
                    - strong [ref=e175]: 安全隔离
                    - text: 每个 Agent 的文件、记忆和运行环境互相隔离，确保数据安全和隐私。
              - paragraph [ref=e176]:
                - text: 简而言之，FastClaw 为企业或开发者提供了一套
                - strong [ref=e177]: 即插即用、可管理、可扩展
                - text: 的 AI Agent 基础设施，让在多租户环境中部署和运营智能代理变得更加高效和可靠。
