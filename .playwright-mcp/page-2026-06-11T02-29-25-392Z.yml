                - rowgroup [ref=e200]:
                  - row "认知失调理论（Festinger） 人们倾向于让自己的行为与态度保持一致。如果我们已经帮助了别人，内心会出现“我为什么帮了他？”的认知冲突。为了解除这种不适，我们会倾向于说服自己“我帮他是因为我" [ref=e201]:
