              - heading "富兰克林效应（Franklin Effect）是什么？" [level=2] [ref=e184]
              - paragraph [ref=e185]:
                - strong [ref=e186]: 定义
                - text: 富兰克林效应是一种心理学现象，指的是当人们对某人或某事
                - strong [ref=e187]: 付出帮助
                - text: 或
                - strong [ref=e188]: 做出恩惠
                - text: 时，往往会
                - strong [ref=e189]: 提升对帮助对象的好感
                - text: ，甚至比原本只是接受帮助的人更喜欢对方。换句话说，
                - strong [ref=e190]: “帮助别人会让我们更喜欢他们”
                - text: 。
              - heading "1. 产生的背景" [level=3] [ref=e191]
              - paragraph [ref=e192]:
                - text: 该效应得名于美国开国元勋本杰明·富兰克林（Benjamin Franklin）。
                - text: 在《富兰克林自传》中记载，富兰克林想让一位不喜欢他的政治对手约翰·佩恩（John Payne）对自己友好。于是他写信请求佩恩帮忙借一本书。佩恩满足了请求，后来富兰克林再写信请求借另一件东西，佩恩又帮忙。随之，两人逐渐建立了友好关系。富兰克林得出结论：
                - strong [ref=e193]: 让对方为自己做事，能够让对方产生认同感，进而提升好感
                - text: 。
              - heading "2. 心理学解释" [level=3] [ref=e194]
              - table [ref=e195]:
                - rowgroup [ref=e196]:
                  - row "解释角度 关键点" [ref=e197]:
