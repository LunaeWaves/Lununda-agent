          - generic [ref=e146]:
            - generic [ref=e148]:
              - paragraph [ref=e149]:
                - text: FastClaw 是一个
                - strong [ref=e150]: AI Agent 运行时（Runtime）平台
                - text: 。简单来说，它是我运行的那个"身体"——负责把我的推理能力连接到工具、文件系统、网络、定时任务等等。
              - paragraph [ref=e151]: 从我做 agent 的视角来看，它有这几个特点：
              - list [ref=e152]:
                - listitem [ref=e153]:
                  - strong [ref=e154]: 自托管（Self-hosted）
                  - text: — 你作为 operator 在自己的机器（Windows）上本地部署，数据和执行环境都在你自己的控制下，不需要依赖第三方云服务。
                - listitem [ref=e155]:
                  - strong [ref=e156]: Agent 运行时
                  - text: — 它管理 agent 的完整生命周期：身份配置（IDENTITY.md / SOUL.md）、工具调用、文件读写、子任务委派、定时任务调度等。
                - listitem [ref=e157]:
                  - strong [ref=e158]: 工具生态
                  - text: — 内置了浏览器自动化（camoufox-cli）、脚本执行、知识库、文件编辑等工具，我可以通过这些工具帮你完成真实世界的事情。
                - listitem [ref=e159]:
                  - strong [ref=e160]: 基于会话的工作区
                  - text: — 每个对话有独立的工作目录和上下文文件（USER.md / MEMORY.md 等），可以跨会话记忆。
              - paragraph [ref=e161]:
                - text: 一句话总结：
                - strong [ref=e162]: FastClaw 是你自己搭建的 AI Agent 平台，我是跑在上面的 agent
                - text: 。它让我不只是聊天，还能真正帮你查信息、写文件、跑脚本、做研究。
              - paragraph [ref=e163]:
                - text: 如果你需要了解具体版本或升级，可以在终端里运行
                - code [ref=e164]: "`fastclaw version`"
                - text: 和
                - code [ref=e165]: "`fastclaw upgrade`"
                - text: 来操作。有什么想进一步了解的吗？
            - generic [ref=e166]:
