##
## Lununda Agent — single-machine deployment with Postgres.
##
## Builds the image from local source. For a faster, no-source setup
## using the pre-built GHCR image, use docker-compose.ghcr.yml instead.
##
## Quick start:
##   docker compose up -d
##   open http://localhost:18953        # walks the onboard wizard:
##                                       # super-admin account + first
##                                       # provider + first agent
##
## Or initialize from CLI without opening the web UI:
##   docker compose exec lununda lununda admin create-user \
##     --username alice --email alice@example.com --password 'hunter2' \
##     --role super_admin
##
## All runtime config goes through LUNUNDA_* env vars — no config file.
##
services:
  lununda:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: lununda/lununda:latest
    restart: unless-stopped
    ports:
      - "${LUNUNDA_PORT:-18953}:18953"
    volumes:
      - lununda-data:/data/.lununda
    environment:
      # Server default timezone (IANA name). This is the LAST fallback in
      # the chain chatter pref → agent default → system default → TZ —
      # without it the container runs UTC and agents whose chatters never
      # set a timezone get UTC wall clocks and UTC-fired schedules.
      TZ: "${TZ:-Asia/Shanghai}"
      # LUNUNDA_HOME — sqlite db path + sandbox root + skill cache live here
      LUNUNDA_HOME: /data/.lununda
      # Bind to all interfaces so the host port mapping works
      LUNUNDA_BIND: all
      LUNUNDA_PORT: "18953"
      # Postgres backend (sqlite would also work; use it by clearing
      # these two and removing the postgres service below)
      LUNUNDA_STORAGE_TYPE: postgres
      LUNUNDA_STORAGE_DSN: "postgres://lununda:${POSTGRES_PASSWORD:-lununda-secret}@postgres:5432/lununda?sslmode=disable"
      LUNUNDA_STORAGE_AUTO_MIGRATE: "true"
      # Sandbox (optional; uncomment to enable)
      # LUNUNDA_SANDBOX_ENABLED: "true"
      # LUNUNDA_SANDBOX_BACKEND: docker
      # LUNUNDA_SANDBOX_IMAGE: python:3.12-slim
    depends_on:
      postgres:
        condition: service_healthy
    command: ["gateway"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lununda
      POSTGRES_USER: lununda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lununda-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lununda"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  lununda-data:
  postgres-data:
