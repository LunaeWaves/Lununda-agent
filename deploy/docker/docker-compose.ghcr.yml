##
## Lununda Agent — pre-built GHCR image (SQLite, zero dependencies).
##
## Pulls ghcr.io/lunaewaves/lununda — no source code, no build step.
## This is the recommended compose for self-hosters who just want to
## run Lununda Agent, not develop it.
##
## Quick start:
##   docker compose -f docker-compose.ghcr.yml up -d
##   open http://localhost:18953
##
## Compose overrides can be stacked on top:
##   # Add Postgres backend
##   docker compose -f docker-compose.ghcr.yml -f docker-compose.postgres.yml up -d
##
##   # Add Docker sandbox (agent exec tool)
##   docker compose -f docker-compose.ghcr.yml -f docker-compose.sandbox.yml up -d
##
##   # All three together
##   docker compose -f docker-compose.ghcr.yml \
##                  -f docker-compose.postgres.yml \
##                  -f docker-compose.sandbox.yml up -d
##
## Copy .env.example to .env for one-shot env customization.
##
services:
  lununda:
    image: ghcr.io/lunaewaves/lununda:${LUNUNDA_VERSION:-latest}
    restart: unless-stopped
    pull_policy: ${LUNUNDA_PULL_POLICY:-missing}
    ports:
      - "${LUNUNDA_PORT:-18953}:18953"
    volumes:
      - lununda-data:/data/.lununda
    environment:
      # Server timezone. Last fallback in chatter pref → agent default
      # → system default → TZ. Without it cron jobs fire in UTC.
      TZ: "${TZ:-Asia/Shanghai}"
      LUNUNDA_HOME: /data/.lununda
      LUNUNDA_BIND: all
      LUNUNDA_PORT: "18953"
      # SQLite is the default — no extra service needed. Switch to
      # Postgres via docker-compose.postgres.yml override.
      LUNUNDA_STORAGE_TYPE: sqlite
      LUNUNDA_STORAGE_AUTO_MIGRATE: "true"
      LUNUNDA_LOG_LEVEL: "${LUNUNDA_LOG_LEVEL:-info}"
    command: ["gateway"]

volumes:
  lununda-data:
