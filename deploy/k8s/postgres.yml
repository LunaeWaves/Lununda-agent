# Optional — in-cluster self-hosted Postgres, suitable for dev / single-node trials.
# For production, prefer a managed service (Aliyun RDS / AWS RDS / etc.) and
# point lununda.yaml's lununda-secrets.STORAGE_DSN at it; this file is not needed.
#
# To use alongside lununda.yaml:
#   1. kubectl apply -f postgres.yml          (creates the resources below)
#   2. In lununda.yaml, set lununda-secrets.STORAGE_DSN to:
#        postgres://lununda:<POSTGRES_PASSWORD above>@lununda-db:5432/lununda?sslmode=disable
#   3. kubectl apply -f lununda.yaml
apiVersion: v1
kind: Secret
metadata:
  name: lununda-db
  namespace: lununda
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me-in-production"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lununda-db
  namespace: lununda
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lununda-db
  namespace: lununda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lununda-db
  template:
    metadata:
      labels:
        app: lununda-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: lununda
        - name: POSTGRES_USER
          value: lununda
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lununda-db
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "lununda"]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: lununda-db
---
apiVersion: v1
kind: Service
metadata:
  name: lununda-db
  namespace: lununda
spec:
  selector:
    app: lununda-db
  ports:
  - port: 5432
